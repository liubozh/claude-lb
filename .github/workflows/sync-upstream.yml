# Opens a reviewable PR for upstream changes; never merges them automatically.
name: Upstream sync PR

on:
  schedule:
    # 10:00 Asia/Hong_Kong (02:00 UTC) every day.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  open-sync-pr:
    name: open sync PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch upstream master
        run: |
          git remote add upstream https://github.com/KarpelesLab/teamclaude.git
          git fetch --no-tags upstream master

      - name: Open an upstream synchronization PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          synced_sha="$(tr -d '[:space:]' < .upstream-sha)"
          upstream_sha="$(git rev-parse upstream/master)"

          if [ "$synced_sha" = "$upstream_sha" ]; then
            echo "Claude LB already tracks upstream commit $upstream_sha"
            exit 0
          fi

          if ! git merge-base --is-ancestor "$synced_sha" "$upstream_sha"; then
            echo "Recorded upstream commit $synced_sha is not an ancestor of $upstream_sha"
            echo "Refusing to sync rewritten upstream history automatically"
            exit 1
          fi

          open_pr="$(gh api \
            "repos/$GITHUB_REPOSITORY/pulls?state=open&base=master&per_page=100" \
            --jq '[.[] | select(.head.ref | startswith("sync/upstream-"))][0].number // empty')"
          if [ -n "$open_pr" ]; then
            echo "Upstream synchronization PR #$open_pr is already open"

            head_ref="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$open_pr" --jq '.head.ref')"
            head_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$open_pr" --jq '.head.sha')"
            test_checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha/check-runs" --jq '[.check_runs[] | select(.name == "test")] | length')"
            if [ "$test_checks" -eq 0 ]; then
              echo "No test check exists for $head_sha; dispatching CI"
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
                -f ref="$head_ref"
            fi
            exit 0
          fi

          short_sha="$(git rev-parse --short=12 upstream/master)"
          branch="sync/upstream-$short_sha"
          patch_file="$RUNNER_TEMP/upstream-code.patch"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Reusing existing synchronization branch $branch"
          else
            git switch --create "$branch" origin/master

            git diff --binary "$synced_sha" "$upstream_sha" -- \
              . \
              ':(exclude).github/**' \
              ':(exclude).upstream-sha' \
              ':(exclude)LICENSE' \
              ':(exclude)README.md' \
              ':(exclude)SECURITY.md' > "$patch_file"

            if [ -s "$patch_file" ]; then
              git apply --3way --index "$patch_file"
            else
              echo "Upstream has no code changes outside repository-owned files"
            fi

            printf '%s\n' "$upstream_sha" > .upstream-sha
            git add .upstream-sha

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: sync upstream master ($short_sha)"

            git push origin "$branch"
          fi

          pr_body="$(printf 'Apply code changes from KarpelesLab/teamclaude between %s and %s.\n\nRepository-owned workflows, identity documents, and the license file are excluded. Review and test the imported code before merging.' "$synced_sha" "$upstream_sha")"

          pr_url="$(gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" \
            -f base=master \
            -f head="$branch" \
            -f title="chore: sync upstream master ($short_sha)" \
            -f body="$pr_body" \
            --jq '.html_url')"
          echo "Created $pr_url"

          # Pull requests created with GITHUB_TOKEN do not emit pull_request
          # events, so dispatch CI explicitly for the synchronization branch.
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -f ref="$branch"
